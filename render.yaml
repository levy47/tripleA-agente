services:
  - type: web
    name: agente-formularios-worldwide-medical
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 300
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
